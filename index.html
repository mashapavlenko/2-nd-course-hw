<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <img src="./img/Star 2.svg" alt="Star" class="header__star2">
        <img src="./img/Star 3.png" alt="Star" class="header__star3">
        <img src="./img/Vector 4780.png" alt="vector" class="header__vector1">
